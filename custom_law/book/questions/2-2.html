<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="UTF-8">
	<title>關稅法規 完稅價格題目</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		.my-card {
			border: 1px solid #d1d9e6;
			border-radius: 8px;
			padding: 8px 12px;
			background: #ffffff;
			box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
			margin-bottom: 8px;
		}
	</style>
</head>

<body>
	<div class="container mt-4">
		<h1>完稅價格題目</h1>
		<h3>「整套機器及其必須設備，拆散、分裝報運進口者，得按整套機器設備應列之稅則號別徵稅。」請依關稅法與其施行細則說明相關規定與適用範圍。</h3>
		<div class="my-card">
			<b>簡單說</b>
			<ul>
				<li>
					整套機器因太大必須分批進口時，只要「事前向海關證明」並「經核明屬實」：
					<ul>
						<li>
							就可以按整套機器的稅則課稅，而不是按零件分別課稅。
						</li>
					</ul>
				</li>
			</ul>
			<h5>提示</h5>
			
		</div>

	</div>

	<!-- Bootstrap 5 JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
