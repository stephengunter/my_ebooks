<!DOCTYPE html>

	<title>行政訴訟法 9 附則</title>

<body>
	<div class="container mt-4">
		<div>
			<h3>9 附則</h3>

			<h5>第307-1條 民事訴訟法之概括準用</h5>
			<ul style="font-weight: 700;">
			
				<li>
					「民事訴訟法之規定，除本法已規定準用者外，與行政訴訟性質不相牴觸者，亦準用之。」
				</li>
			</ul>
			<b>白話文</b>
			<ul>
				<li>
					民事訴訟法的規定，除了行政訴訟法已經明文規定準用的之外，只要與行政訴訟的性質不相牴觸，也可以準用。
				</li>
			</ul>
			<h5>第308條 施行日期</h5>
			<ol style="font-weight: 700;">
			
				<li>
					「本法自公布日施行。」
				</li>
				<li>
					「本法修正條文施行日期，由司法院以命令定之。」
				</li>
			</ol>
			<b>白話文</b>
			<ul>
				<li>
					行政訴訟法自公布日施行；至於修正條文的施行日期，則由司法院以命令定之。
				</li>
			</ul>

		</div>
	</div>

	<!-- Bootstrap 5 JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
